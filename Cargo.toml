[workspace]
members  = ["crates/tabref-core", "crates/tabref-cdp", "crates/tabref-page", "crates/tabref"]
resolver = "2"

[workspace.package]
edition      = "2024"
rust-version = "1.89"
license      = "Apache-2.0"
version      = "0.1.0"

[workspace.dependencies]
clap        = { version = "4.6", features = ["derive", "env"] }
serde       = { version = "1.0", features = ["derive"] }
serde_json  = { version = "1.0", features = ["float_roundtrip"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tabref-core = { path = "crates/tabref-core" }
tabref-cdp  = { path = "crates/tabref-cdp" }
tabref-page = { path = "crates/tabref-page" }

[workspace.lints.rust]
unsafe_code     = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro    = "deny"
todo         = "deny"
unwrap_used  = "deny"
expect_used  = "deny"
panic        = "deny"
collapsible_if = "allow"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"
