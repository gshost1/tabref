<!doctype html><html><head><title>Theme</title><style>
.pick{border:1px solid #888;width:160px;padding:4px;cursor:pointer}.menu{border:1px solid #999;width:170px}.menu.shut{display:none}
</style></head><body><h1>Theme</h1>
<div class="pick" id="theme" tabindex="0" onclick="document.getElementById('menu').classList.toggle('shut')">Light</div>
<div class="menu shut" id="menu"><div class="item" onclick="theme.textContent='Dark'">Dark</div><div class="item" onclick="theme.textContent='Light'">Light</div></div>
</body></html>
