<!doctype html>
<title>Checkout</title>
<div id="app">
  <h1>Checkout</h1>
  <button>Quiet</button>
  <button onclick="reveal()">Reveal cards</button>
  <button onclick="placeOrder()">Place order</button>
  <button onclick="revealButtonFirst(2)">Reveal two button-first cards</button>
  <button onclick="revealButtonFirst(3)">Reveal three button-first cards</button>
  <button onclick="revealButtonFirst(3, true)">Reveal ambiguous cards</button>
  <main id="cards" hidden>
    <div>
      <h3>Card A</h3>
      <p><button onclick="selectCard('Card A')">Actions</button></p>
      <h3>Card B</h3>
      <p><button onclick="selectCard('Card B')">Actions</button></p>
    </div>
  </main>
  <div id="button-first"></div>
  <div id="toast" hidden><button>Undo</button></div>
  <p id="status"></p>
  <output id="orders">0</output>
</div>
<script>
function reveal() {
  document.getElementById('cards').hidden = false;
  document.getElementById('toast').hidden = false;
}
function selectCard(title) {
  document.getElementById('status').textContent = 'Selected ' + title;
}
function revealButtonFirst(count, ambiguous = false) {
  document.getElementById('button-first').innerHTML = ['Card A', 'Card B', 'Card C']
    .slice(0, count)
    .map((title, index) => {
      const button = `<button onclick="selectCard('${title}')">Actions</button>`;
      const heading = `<h3>${title}</h3>`;
      return ambiguous && index === 1 ? heading + button : button + heading;
    })
    .join('');
}
function placeOrder() {
  const orders = document.getElementById('orders');
  orders.value = Number(orders.value) + 1;
  const receipt = document.createElement('button');
  receipt.textContent = 'Receipt';
  document.getElementById('app').append(receipt);
}
</script>
