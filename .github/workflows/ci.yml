name: Windows reconnect timing
on: workflow_dispatch
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: 0
jobs:
  reconnect:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - name: Verify the Windows reconnect regression
        run: cargo test --locked -p tabref --test windows_launch_connect
