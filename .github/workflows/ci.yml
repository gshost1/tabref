name: Windows reconnect timing
on: workflow_dispatch
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: 0
jobs:
  reconnect:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build both CLI revisions
        shell: pwsh
        run: |
          $current = git rev-parse HEAD
          git checkout --detach 784adba1cbeb355b3ca02a233a784dd0e92edf7b
          cargo build --locked -p tabref
          Copy-Item target/debug/tabref.exe "$env:RUNNER_TEMP/before.exe"
          git checkout --detach $current
          cargo build --locked -p tabref
      - name: Measure Windows reconnects to the loopback CDP fixture
        timeout-minutes: 3
        run: cargo test --locked -p tabref-cdp --test windows_reconnect_timing -- --nocapture
