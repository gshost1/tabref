name: Windows reconnect timing
on: workflow_dispatch
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: 0
jobs:
  reconnect:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build both CLI revisions
        shell: pwsh
        run: |
          $current = git rev-parse HEAD
          git checkout --detach 784adba1cbeb355b3ca02a233a784dd0e92edf7b
          cargo build --locked -p tabref
          Copy-Item target/debug/tabref.exe "$env:RUNNER_TEMP/before.exe"
          git checkout --detach b110612
          cargo build --locked -p tabref
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git checkout --detach $current
      - name: Time successful reconnects to one Chrome instance
        timeout-minutes: 3
        run: python -u scripts/time-windows-reconnect.py
